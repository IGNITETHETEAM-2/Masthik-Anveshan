<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masthik Anveshan - Clinician Sign In</title>
    <meta name="description" content="Sign in to Masthik Anveshan - Advanced Brain Tumor Segmentation & Diagnostic Intelligence Platform.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --auth-bg: #060911;
            --auth-surface: rgba(15, 23, 42, 0.85);
            --auth-border: rgba(0, 242, 254, 0.22);
            --auth-cyan: #00f2fe;
            --auth-cyan-glow: rgba(0, 242, 254, 0.25);
            --auth-violet: #8b5cf6;
            --auth-emerald: #10b981;
            --auth-text-main: #f8fafc;
            --auth-text-muted: #94a3b8;
            --auth-text-subtle: #64748b;
            --auth-input-bg: rgba(6, 11, 22, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.auth-body {
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--auth-bg);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.09) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.04) 0%, transparent 60%);
            background-attachment: fixed;
            color: var(--auth-text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .auth-card-container {
            width: 100%;
            max-width: 480px;
            background: var(--auth-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--auth-border);
            border-radius: 20px;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7), 0 0 30px -5px var(--auth-cyan-glow);
            padding: 36px 32px;
            animation: authFadeIn 0.4s ease forwards;
        }

        @keyframes authFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-logo-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 14px;
            background: linear-gradient(135deg, var(--auth-cyan), var(--auth-violet));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--auth-cyan-glow);
        }

        .auth-logo-icon svg {
            width: 26px;
            height: 26px;
            fill: #fff;
        }

        .auth-brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 800;
            color: #fff;
        }

        .auth-brand-title span {
            background: linear-gradient(135deg, var(--auth-cyan), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-page-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-top: 6px;
        }

        .auth-page-desc {
            font-size: 0.82rem;
            color: var(--auth-text-muted);
            margin-top: 4px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--auth-text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--auth-text-subtle);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .auth-input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            background: var(--auth-input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9px;
            color: #fff;
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .auth-input:focus {
            border-color: var(--auth-cyan);
            box-shadow: 0 0 12px var(--auth-cyan-glow);
        }

        .toggle-pw-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--auth-text-subtle);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .auth-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            margin-top: 2px;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--auth-text-muted);
            cursor: pointer;
        }

        .remember-checkbox {
            accent-color: var(--auth-cyan);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--auth-cyan);
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .auth-submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--auth-cyan), #00b4d8);
            border: none;
            border-radius: 9px;
            color: #030712;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0, 242, 254, 0.35);
            transition: all 0.2s ease;
            margin-top: 4px;
        }

        .auth-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        .demo-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .demo-title {
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--auth-text-subtle);
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .demo-chip-btn {
            width: 100%;
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: var(--auth-text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .demo-chip-btn:hover {
            background: rgba(0, 242, 254, 0.08);
            border-color: rgba(0, 242, 254, 0.4);
            transform: translateX(3px);
        }

        .demo-chip-name {
            font-weight: 600;
            color: #fff;
        }

        .demo-chip-role {
            font-size: 0.72rem;
            color: var(--auth-cyan);
            font-family: 'JetBrains Mono', monospace;
        }

        .auth-switch-footer {
            text-align: center;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.82rem;
            color: var(--auth-text-muted);
        }

        .auth-switch-footer a {
            color: var(--auth-cyan);
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }

        .auth-switch-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="auth-body">

    <div class="auth-card-container">
        <!-- Brand Header -->
        <div class="auth-brand-header">
            <div class="auth-logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
            </div>
            <div class="auth-brand-title">Masthik <span>Anveshan</span></div>
            <h2 class="auth-page-title">Clinician Sign In</h2>
            <p class="auth-page-desc">Enter your credentials to access the workstation</p>
        </div>

        <!-- Form -->
        <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div class="form-group">
                <label class="form-label" for="loginEmail">Email Address</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </span>
                    <input type="email" id="loginEmail" class="auth-input" placeholder="radhika@neuro.ai" value="radhika@neuro.ai" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="loginPassword">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="loginPassword" class="auth-input" value="password123" required>
                    <button type="button" class="toggle-pw-btn" id="togglePasswordBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div class="auth-options">
                <label class="remember-label">
                    <input type="checkbox" class="remember-checkbox" checked>
                    <span>Remember me</span>
                </label>
                <a href="javascript:void(0)" onclick="alert('Password reset: Please use the 1-Click Demo Clinician Access below.')" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="auth-submit-btn">
                <span>Sign In to Workstation</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
        </form>

        <!-- 1-Click Demo Section -->
        <div class="demo-section">
            <div class="demo-title">Instant 1-Click Demo Clinician Access</div>
            <button type="button" class="demo-chip-btn" onclick="window.location.href='index.html';">
                <span class="demo-chip-name">Dr. Radhika Muvva, MD</span>
                <span class="demo-chip-role">Chief Neuroradiologist &rarr;</span>
            </button>
            <button type="button" class="demo-chip-btn" onclick="window.location.href='index.html';">
                <span class="demo-chip-name">Dr. Akshay Kumar, PhD</span>
                <span class="demo-chip-role">Senior Researcher &rarr;</span>
            </button>
        </div>

        <div class="auth-switch-footer">
            Don't have an institutional account? 
            <a href="signup.html">Register here</a>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const pwInput = document.getElementById('loginPassword');
        toggleBtn.addEventListener('click', () => {
            const isPassword = pwInput.type === 'password';
            pwInput.type = isPassword ? 'text' : 'password';
        });
    </script>
</body>
</html>
